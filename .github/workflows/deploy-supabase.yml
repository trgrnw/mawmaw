name: Deploy Supabase backend

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'supabase/migrations/**'
      - 'supabase/functions/**'
      - 'supabase/config.toml'
      - '.github/workflows/deploy-supabase.yml'

concurrency:
  group: supabase-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_REF: ${{ vars.VITE_SUPABASE_PROJECT_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Validate backend
        run: |
          npm ci
          npm run build:domain
          git diff --exit-code -- supabase/functions/_shared/game-engine.js
          npm test
          npm run test:database

      - name: Verify configuration
        run: |
          test -n "$SUPABASE_ACCESS_TOKEN" || (echo "::error::Missing SUPABASE_ACCESS_TOKEN secret" && exit 1)
          test -n "$SUPABASE_DB_PASSWORD" || (echo "::error::Missing SUPABASE_DB_PASSWORD secret" && exit 1)
          test -n "$SUPABASE_PROJECT_REF" || (echo "::error::Missing VITE_SUPABASE_PROJECT_ID variable" && exit 1)

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Link project
        run: supabase link --project-ref "$SUPABASE_PROJECT_REF" --password "$SUPABASE_DB_PASSWORD"

      - name: Verify target project
        run: test "$SUPABASE_PROJECT_REF" = "jfgclzvglotlfviipvrv"

      - name: Back up database before migration
        run: |
          mkdir -p /tmp/game-backup
          supabase db dump --linked -f /tmp/game-backup/roles.sql --role-only
          supabase db dump --linked -f /tmp/game-backup/schema.sql
          supabase db dump --linked -f /tmp/game-backup/data.sql --data-only --use-copy
          test -s /tmp/game-backup/schema.sql
          test -s /tmp/game-backup/data.sql
          tar -czf /tmp/game-backup.tar.gz -C /tmp/game-backup .
          openssl enc -aes-256-cbc -salt -pbkdf2 -iter 200000 -in /tmp/game-backup.tar.gz -out supabase-backup.tar.gz.enc -pass env:SUPABASE_DB_PASSWORD
          rm -rf /tmp/game-backup /tmp/game-backup.tar.gz

      - name: Preserve encrypted database backup
        uses: actions/upload-artifact@v4
        with:
          name: supabase-backup-${{ github.run_id }}
          path: supabase-backup.tar.gz.enc
          retention-days: 7
          if-no-files-found: error

      - name: Preview pending database migrations
        run: supabase db push --include-all --dry-run --password "$SUPABASE_DB_PASSWORD"

      - name: Apply database migrations
        run: supabase db push --include-all --password "$SUPABASE_DB_PASSWORD"

      - name: Deploy Edge Functions
        run: supabase functions deploy --project-ref "$SUPABASE_PROJECT_REF"
